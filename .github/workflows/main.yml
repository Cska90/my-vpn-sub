name: Build Clash Meta Config

on:
  push:
    paths:
      - 'sub.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate config.yaml from sub.txt
        run: |
          # --- Начало конфигурации ---
          echo "proxies:" > config.yaml
          while IFS= read -r line
          do
            uuid=$(echo $line | grep -oP '(?<=vless://)[^@]+' | head -1)
            server=$(echo $line | grep -oP '(?<=@)[^:]+')
            port=$(echo $line | grep -oP '(?<=:)[0-9]+(?=\?)')
            path=$(echo $line | grep -oP '(?<=path=)[^&]+')

            echo "  - name: $server" >> config.yaml
            echo "    type: vless" >> config.yaml
            echo "    server: $server" >> config.yaml
            echo "    port: $port" >> config.yaml
            echo "    uuid: $uuid" >> config.yaml
            echo "    flow: auto" >> config.yaml
            echo "    tls: true" >> config.yaml
            echo "    network: ws" >> config.yaml
            echo "    ws-opts:" >> config.yaml
            echo "      path: $path" >> config.yaml
          done < sub.txt

          # --- Прокси-группы ---
          echo "" >> config.yaml
          echo "proxy-groups:" >> config.yaml
          echo "  - name: AUTO" >> config.yaml
          echo "    type: url-test" >> config.yaml
          echo "    proxies: []" >> config.yaml
          echo "    url: https://www.gstatic.com/generate_204" >> config.yaml
          echo "    interval: 300" >> config.yaml

          echo "  - name: AI" >> config.yaml
          echo "    type: select" >> config.yaml
          echo "    proxies: []" >> config.yaml

          echo "  - name: MEDIA" >> config.yaml
          echo "    type: select" >> config.yaml
          echo "    proxies: []" >> config.yaml

          echo "  - name: SOCIAL" >> config.yaml
          echo "    type: select" >> config.yaml
          echo "    proxies: []" >> config.yaml

          echo "  - name: VPN" >> config.yaml
          echo "    type: select" >> config.yaml
          echo "    proxies: []" >> config.yaml

          echo "  - name: DIRECT" >> config.yaml
          echo "    type: select" >> config.yaml
          echo "    proxies: [DIRECT]" >> config.yaml

          # --- Правила ---
          echo "" >> config.yaml
          echo "rules:" >> config.yaml
          echo "  - GEOIP,RU,DIRECT" >> config.yaml
          echo "  - GEOIP,LAN,DIRECT" >> config.yaml
          echo "  - DOMAIN-SUFFIX,youtube,MEDIA" >> config.yaml
          echo "  - DOMAIN-SUFFIX,telegram,SOCIAL" >> config.yaml
          echo "  - DOMAIN-SUFFIX,whatsapp,SOCIAL" >> config.yaml
          echo "  - DOMAIN-SUFFIX,instagram,SOCIAL" >> config.yaml
          echo "  - DOMAIN-SUFFIX,facebook,SOCIAL" >> config.yaml
          echo "  - DOMAIN-SUFFIX,tiktok,SOCIAL" >> config.yaml
          echo "  - DOMAIN-SUFFIX,twitter,SOCIAL" >> config.yaml
          echo "  - DOMAIN-KEYWORD,openai,AI" >> config.yaml
          echo "  - DOMAIN-KEYWORD,gemini,AI" >> config.yaml
          echo "  - DOMAIN-KEYWORD,claude,AI" >> config.yaml
          echo "  - DOMAIN-SUFFIX,4pda,VPN" >> config.yaml
          echo "  - DOMAIN-SUFFIX,rutracker,VPN" >> config.yaml
          echo "  - DOMAIN-SUFFIX,rutor,VPN" >> config.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add config.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update config.yaml from sub.txt"
            git push
          else
            echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
