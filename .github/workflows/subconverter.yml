name: Build Clash Subscription

on:
  push:
    paths:
      - 'sub.txt'
      - 'config_template.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Subconverter
        run: |
          curl -L -o subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          chmod +x subconverter/subconverter

      - name: Generate Config
        run: |
          cd subconverter
          
          # Создаем абсолютно пустой преф-файл, чтобы он НЕ лез в интернет за правилами
          echo "[common]" > pref.ini
          echo "api_mode=false" >> pref.ini
          
          # Создаем задачу на конвертацию
          echo "[🔗Task]" > rules.ini
          echo "target=clash" >> rules.ini
          echo "url=../sub.txt" >> rules.ini
          echo "output=../proxies_raw.yaml" >> rules.ini
          
          # Запускаем локально
          ./subconverter -s rules.ini
          cd ..

      - name: Merge and Build Final YAML
        run: |
          if [ ! -f proxies_raw.yaml ]; then
            echo "Ошибка: Конвертация не удалась!" && exit 1
          fi
          
          # Вытаскиваем прокси
          sed -n '/^proxies:/,$p' proxies_raw.yaml | sed '1d' > proxies_clean.yaml
          
          # Собираем файл
          cat config_template.yaml > clash_profile.yaml
          echo "" >> clash_profile.yaml
          echo "proxies:" >> clash_profile.yaml
          sed 's/^[[:space:]]*//; s/^/  /' proxies_clean.yaml >> clash_profile.yaml
          
          # Добавляем имена в Auto-Select
          grep -E '^[[:space:]]*- name:' proxies_clean.yaml | while read -r line; do
            name=$(echo "$line" | sed "s/^[[:space:]]*- name:[[:space:]]*//; s/['\"]//g")
            sed -i "/- DIRECT/a \      - \"$name\"" clash_profile.yaml
          done

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clash_profile.yaml
          git commit -m "Fixed infinite loop bug" || exit 0
          git push
          
