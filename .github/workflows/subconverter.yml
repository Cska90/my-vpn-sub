name: Build Clash Subscription

on:
  push:
    paths:
      - 'sub.txt'
      - 'config_template.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and setup Subconverter locally
        run: |
          # Скачиваем и распаковываем subconverter
          curl -L -o subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          
          # Копируем ваш sub.txt прямо в папку с конвертером, чтобы он гарантированно его увидел
          cp sub.txt subconverter/sub.txt
          cd subconverter
          chmod +x subconverter
          
          # Создаем точный конфигурационный файл generate.ini с абсолютным путем
          echo "[subconverter]" > generate.ini
          echo "target=clash" >> generate.ini
          echo "url=sub.txt" >> generate.ini
          echo "output=proxies_raw.yaml" >> generate.ini
          
          # Запускаем генерацию
          ./subconverter -g
          
          # Возвращаем сгенерированный файл обратно в корень репозитория
          cp proxies_raw.yaml ../proxies_raw.yaml
          cd ..

      - name: Merge Proxies into Template
        run: |
          # Проверяем, создался ли файл
          if [ ! -f proxies_raw.yaml ]; then
            echo "Ошибка: Локальный subconverter не смог сгенерировать proxies_raw.yaml!"
            exit 1
          fi

          # Вытаскиваем только блок с прокси (убираем лишние заголовки, если они есть)
          if grep -q "^proxies:" proxies_raw.yaml; then
            sed -n '/^proxies:/,$p' proxies_raw.yaml | sed '1d' > proxies_clean.yaml
          else
            # Если subconverter выдал только список без ключевого слова proxies:
            cat proxies_raw.yaml > proxies_clean.yaml
          fi

          # Начинаем сборку финального конфига
          cat config_template.yaml > clash_profile.yaml
          echo "" >> clash_profile.yaml
          echo "proxies:" >> clash_profile.yaml
          
          # Добавляем прокси с правильным отступом в 2 пробела для валидного YAML
          sed 's/^[[:space:]]*//; s/^/  /' proxies_clean.yaml >> clash_profile.yaml

          # Автоматически добавляем имена прокси в группу Auto-Select (после строки "- DIRECT")
          grep -E '^[[:space:]]*- name:' proxies_clean.yaml | while read -r line; do
            name=$(echo "$line" | sed "s/^[[:space:]]*- name:[[:space:]]*//; s/['\"]//g")
            sed -i "/- DIRECT/a \      - \"$name\"" clash_profile.yaml
          done

      - name: Commit and Push config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clash_profile.yaml
          git commit -m "Update Clash Profile with local subconverter" || exit 0
          git push
          
