name: Build Clash Subscription

on:
  push:
    paths:
      - 'sub.txt'
      - 'config_template.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and setup Subconverter locally
        run: |
          # Скачиваем официальный локальный subconverter для Linux
          curl -L -o subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          cd subconverter
          chmod +x subconverter
          
          # Создаем базовый конфиг генерации (generate.ini)
          echo "[subconverter]" > generate.ini
          echo "target=clash" >> generate.ini
          echo "url=../sub.txt" >> generate.ini
          echo "output=../proxies_raw.yaml" >> generate.ini
          
          # Запускаем локальную конвертацию без сети
          ./subconverter -g
          cd ..

      - name: Merge Proxies into Template
        run: |
          # 1. Проверяем, что файл создался, и очищаем его от лишних блоков, оставляя только чистый список прокси
          if [ -f proxies_raw.yaml ]; then
            # Вырезаем из сгенерированного файла всё, что идет после строки "proxies:"
            sed -n '/^proxies:/,$p' proxies_raw.yaml | sed '1d' > proxies_clean.yaml
          else
            echo "Ошибка: Серверы не сконвертировались!" && exit 1
          fi

          # 2. Собираем итоговый конфиг из шаблона
          cat config_template.yaml > clash_profile.yaml
          echo "" >> clash_profile.yaml
          echo "proxies:" >> clash_profile.yaml
          cat proxies_clean.yaml >> clash_profile.yaml

          # 3. Автоматически прописываем имена серверов в группу автовыбора
          # Извлекаем все имена серверов
          grep -E '^[[:space:]]*- name:' proxies_clean.yaml | while read -r line; do
            name=$(echo "$line" | sed 's/^[[:space:]]*- name:[[:space:]]*//')
            # Вставляем имя сервера в секцию proxies группы Auto-Select (после строки "- DIRECT")
            sed -i "/- DIRECT/a \      - $name" clash_profile.yaml
          done

      - name: Commit and Push config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clash_profile.yaml
          git commit -m "Update Clash Profile with local subconverter" || exit 0
          git push
          
