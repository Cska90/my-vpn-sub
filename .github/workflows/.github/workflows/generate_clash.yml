name: Generate Clash Config

on:
  push:
    paths:
      - 'sub.txt'
      - 'config_template.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Subconverter to generate proxies
        uses: tindy2013/subconverter-action@master
        with:
          arguments: --generate
          
      # Скрипт превращает ссылки из sub.txt в формат, который понимает Clash, 
      # и склеивает их с вашим шаблоном config_template.yaml
      - name: Merge Proxies into Template
        run: |
          curl -s -o proxies.yaml "http://127.0.0.1:25500/sub?target=clash&url=https://raw.githubusercontent.com/${{ github.repository }}/main/sub.txt&list=true"
          
          # Заменяем заглушку - DIRECT в шаблоне на реальный список прокси
          sed -i '/proxies:/,/url:/ { /- DIRECT/d }' config_template.yaml
          sed -i '/proxies:/ r proxies.yaml' config_template.yaml
          
          # Добавляем сами прокси в конец файла
          echo -e "\nproxies:" >> config_template.yaml
          cat proxies.yaml >> config_template.yaml
          
          mv config_template.yaml clash_profile.yaml

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add clash_profile.yaml
          git commit -m "Update Clash Profile" || exit 0
          git push
          
